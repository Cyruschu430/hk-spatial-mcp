[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-spatial-mcp"
version = "0.4.0"
description = "MCP server for Hong Kong CSDI spatial data: search 1,150+ official datasets, map them, optionally publish to ArcGIS Online"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.scripts]
hk-spatial-mcp = "hk_spatial_mcp:main"

[tool.setuptools]
py-modules = ["hk_spatial_mcp"]
